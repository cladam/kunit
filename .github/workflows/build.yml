name: Build, Test, and Release

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags like v0.1.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Type-check library
        run: koka -isrc --library kunit.kk

      - name: Run tests
        run: koka -isrc -e tests/test-kunit.kk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          tar czf kunit-${{ github.ref_name }}.tar.gz \
            kunit.kk src/ LICENSE README.md AUTHORS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: kunit-${{ github.ref_name }}.tar.gz
          generate_release_notes: true